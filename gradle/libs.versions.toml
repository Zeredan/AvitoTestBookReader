[versions]
coilCompose = "3.2.0"
datastorePreferences = "1.2.0"
firebaseBom = "34.4.0"
firebaseCrashlyticsGradle = "3.0.6"
googleServices = "4.4.4"
gson = "2.13.1"
hiltAndroidGradlePlugin = "2.54"
agp = "8.7.3"
hiltNavigationCompose = "1.3.0"
kotlin = "2.0.0"
appcompat = "1.7.1"
kotlinxMetadataJvm = "0.6.0"
material = "1.13.0"
coreKtx = "1.17.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.9.4"
activityCompose = "1.11.0"
composeBom = "2025.11.01"

loggingInterceptor = "4.12.0"
navigationCompose = "2.9.6"
retrofit = "2.11.0"
converterGson = "2.11.0"
roomKtx = "2.8.4"


[libraries]
androidx-core-ktx = { group="androidx.core", name="core-ktx", version.ref="coreKtx" }
androidx-datastore-preferences = { module="androidx.datastore:datastore-preferences", version.ref="datastorePreferences" }
androidx-hilt-navigation-compose = { module="androidx.hilt:hilt-navigation-compose", version.ref="hiltNavigationCompose" }
androidx-navigation-compose = { module="androidx.navigation:navigation-compose", version.ref="navigationCompose" }

# Room
androidx-room-compiler = { module="androidx.room:room-compiler", version.ref="roomKtx" }
androidx-room-ktx = { module="androidx.room:room-ktx", version.ref="roomKtx" }
androidx-room-runtime = { module="androidx.room:room-runtime", version.ref="roomKtx" }

# Coil
coil-compose = { module="io.coil-kt.coil3:coil-compose", version.ref="coilCompose" }
coil-network-okhttp = { module="io.coil-kt.coil3:coil-network-okhttp", version.ref="coilCompose" }

# Firebase BOM
firebase-bom = { module="com.google.firebase:firebase-bom", version.ref="firebaseBom" }

# Firebase ktx (без версий!)
firebase-auth-ktx = { module="com.google.firebase:firebase-auth-ktx" }
firebase-firestore-ktx = { module="com.google.firebase:firebase-firestore-ktx" }
firebase-storage-ktx = { module="com.google.firebase:firebase-storage-ktx" }
firebase-analytics-ktx = { module="com.google.firebase:firebase-analytics-ktx" }
firebase-config-ktx = { module="com.google.firebase:firebase-remote-config-ktx" }
firebase-crashlytics = { module="com.google.firebase:firebase-crashlytics-ktx" }
firebase-messaging = { module="com.google.firebase:firebase-messaging-ktx" }

gson = { module="com.google.code.gson:gson", version.ref="gson" }

# Hilt
hilt-android = { module="com.google.dagger:hilt-android", version.ref="hiltAndroidGradlePlugin" }
hilt-android-compiler = { module="com.google.dagger:hilt-android-compiler", version.ref="hiltAndroidGradlePlugin" }

# Tests
junit = { group="junit", name="junit", version.ref="junit" }
androidx-junit = { group="androidx.test.ext", name="junit", version.ref="junitVersion" }
androidx-espresso-core = { group="androidx.test.espresso", name="espresso-core", version.ref="espressoCore" }

# AndroidX / Compose
androidx-lifecycle-runtime-ktx = { group="androidx.lifecycle", name="lifecycle-runtime-ktx", version.ref="lifecycleRuntimeKtx" }
androidx-activity-compose = { group="androidx.activity", name="activity-compose", version.ref="activityCompose" }
androidx-compose-bom = { group="androidx.compose", name="compose-bom", version.ref="composeBom" }
androidx-ui = { group="androidx.compose.ui", name="ui" }
androidx-ui-graphics = { group="androidx.compose.ui", name="ui-graphics" }
androidx-ui-tooling = { group="androidx.compose.ui", name="ui-tooling" }
androidx-ui-tooling-preview = { group="androidx.compose.ui", name="ui-tooling-preview" }
androidx-ui-test-manifest = { group="androidx.compose.ui", name="ui-test-manifest" }
androidx-ui-test-junit4 = { group="androidx.compose.ui", name="ui-test-junit4" }
androidx-material3 = { group="androidx.compose.material3", name="material3" }
androidx-appcompat = { group="androidx.appcompat", name="appcompat", version.ref="appcompat" }

kotlinx-metadata-jvm = { module="org.jetbrains.kotlinx:kotlinx-metadata-jvm", version.ref="kotlinxMetadataJvm" }
material = { group="com.google.android.material", name="material", version.ref="material" }

# Network
retrofit = { module="com.squareup.retrofit2:retrofit", version.ref="retrofit" }
retrofit2-converter-gson = { module="com.squareup.retrofit2:converter-gson", version.ref="converterGson" }
logging-interceptor = { module="com.squareup.okhttp3:logging-interceptor", version.ref="loggingInterceptor" }


[plugins]
android-application = { id="com.android.application", version.ref="agp" }
android-library = { id="com.android.library", version.ref="agp" }
kotlin-android = { id="org.jetbrains.kotlin.android", version.ref="kotlin" }
kotlin-compose = { id="org.jetbrains.kotlin.plugin.compose", version.ref="kotlin" }
google-services = { id="com.google.gms.google-services", version.ref="googleServices" }
firebase-crashlytics-gradle = { id="com.google.firebase.crashlytics", version.ref="firebaseCrashlyticsGradle" }
